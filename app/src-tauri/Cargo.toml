[package]
name = "factory-app"
version = "0.1.0"
description = "The factory's Mac app: the widget pill, the full window and the menu bar icon, all views of the engine."
edition = "2021"
publish = false

[lib]
name = "factory_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
