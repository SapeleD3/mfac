name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y tmux
      - run: npm ci
      - run: npx biome ci --error-on-warnings
      - run: npm run typecheck
      - run: npm run check:rules
      - run: npm test
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: TLC on the task model (Cap = 3)
        run: node scripts/tlc.mjs spec/Factory.tla
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: UI types and bundle
        run: npm run typecheck && node build.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust format
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Tauri shell compiles cleanly (macOS)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
