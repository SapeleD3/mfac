name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: TLC on the task model (Cap = 3)
        run: node scripts/tlc.mjs spec/Factory.tla
