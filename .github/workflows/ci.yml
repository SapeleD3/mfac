name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:rules
      - run: npm test
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: TLC on the task model (Cap = 3)
        run: node scripts/tlc.mjs spec/Factory.tla
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: UI types and bundle
        run: npm run typecheck && node build.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Tauri shell compiles (macOS)
        run: cargo check --manifest-path src-tauri/Cargo.toml
